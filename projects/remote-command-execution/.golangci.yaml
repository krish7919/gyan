version: "2"
output:
  formats:
    text:
      path: stderr
  sort-order:
    - severity
    - file
    - linter
linters:
  default: all
  disable:
    - cyclop
    - decorder
    - depguard
    - dupl
    - dupword
    - err113
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - gosec
    - inamedparam
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - maintidx
    - mnd
    - nestif
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - revive
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - unparam
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
  settings:
    bidichk:
      left-to-right-embedding: false
      right-to-left-embedding: false
      pop-directional-formatting: false
      left-to-right-override: false
      right-to-left-override: false
      left-to-right-isolate: false
      right-to-left-isolate: false
      first-strong-isolate: false
      pop-directional-isolate: false
    copyloopvar:
      check-alias: true
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      ignore-underscore-vars: false
      disable-dec-num-check: true
      disable-dec-order-check: false
      disable-init-func-first-check: false
    gocyclo:
      min-complexity: 10
    gosmopolitan:
      watch-for-scripts:
        - Devanagari
        - Han
        - Hangul
        - Hiragana
        - Katakana
    nestif:
      min-complexity: 3
    prealloc:
      for-loops: true
    predeclared:
      qualified-name: true
    promlinter:
      strict: true
    sloglint:
      no-mixed-args: false
      kv-only: true
      no-global: ""
      context: ""
      static-msg: true
      no-raw-keys: true
      key-naming-case: snake
      forbidden-keys:
        - level
        - msg
        - source
        - time
      args-on-sep-lines: true
    spancheck:
      checks:
        - end
        - record-error
        - set-status
    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - yml
        - toml
        - mapstructure
        - binding
        - vault
        - validate
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
        use-field-name: true
    testifylint:
      enable-all: true
      bool-compare:
        ignore-custom-types: true
    unconvert:
      fast-math: true
      safe: true
    unparam:
      check-exported: true
    wsl:
      allow-assign-and-anything: true
      allow-trailing-comment: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/krish7919)
        - blank
        - dot
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
